# Datasource URL/credentials/driver are supplied by PostgreSqlContainerRunner (TestContainers, requires Docker)
# required by MyJpaProperties validation (the URL is set by the container, so the values are unused)
spring.datasource.my.host=localhost
spring.datasource.my.port=5432
spring.datasource.my.database=jpa-it
spring.jpa.hibernate.ddl-auto=create-drop
# create the DB functions after Hibernate has exported the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-jpa-it.sql
# keep @Column names verbatim so that the SQL templates embedded by EnhancedSqlDialect (which reference the camelCase
# property name) resolve in PostgreSQL: unquoted identifiers fold to lowercase consistently in DDL and queries
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
app.database.dialect=POSTGRES
