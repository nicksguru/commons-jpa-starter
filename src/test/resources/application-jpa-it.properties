# H2 in-memory database shared by the repository regression tests (no Docker needed)
spring.datasource.url=jdbc:h2:mem:jpa-it;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
# required by MyJpaProperties validation (the URL above is explicit, so the values are unused)
spring.datasource.my.host=localhost
spring.datasource.my.port=5432
spring.datasource.my.database=jpa-it
spring.jpa.hibernate.ddl-auto=create-drop
# create the DB function aliases after Hibernate has exported the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-jpa-it.sql
# keep @Column names verbatim so that the SQL templates embedded by EnhancedSqlDialect resolve in H2
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
app.database.dialect=POSTGRES
